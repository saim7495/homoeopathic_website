version: '3.8'

services:
  healwell-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: healwell-homeopathy
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - healwell-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.healwell.rule=Host(`healwell.local`)"
      - "traefik.http.services.healwell.loadbalancer.server.port=8080"

networks:
  healwell-network:
    driver: bridge